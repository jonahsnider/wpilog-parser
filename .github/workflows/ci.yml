name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
      - name: Build workspace packages in dependency order
        run: vp run build
      - parallel:
          - run: vp check
          - run: vp test run
          - run: vp run --filter './packages/*' api:check && node scripts/check-packages.ts
