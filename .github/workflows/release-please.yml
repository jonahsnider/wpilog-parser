on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

name: release-please

jobs:
  release-please:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Checkout Git repository
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          registry-url: 'https://registry.npmjs.org'
        if: ${{ steps.release.outputs.releases_created == 'true' }}
      - name: Lint, test, and build
        run: vp run build && vp check && vp test run && vp run --filter './packages/*' api:check && node scripts/check-packages.ts
        if: ${{ steps.release.outputs.releases_created == 'true' }}
      # Publish dependencies before their consumers.
      - name: Publish wpilib-struct to npm
        run: pnpm --filter wpilib-struct publish --provenance --access public --no-git-checks --publish-wait-timeout 600000
        if: ${{ steps.release.outputs['packages/wpilib-struct--release_created'] == 'true' }}
      - name: Publish wpilog-parser to npm
        run: pnpm --filter wpilog-parser publish --provenance --access public --no-git-checks --publish-wait-timeout 600000
        if: ${{ steps.release.outputs['packages/wpilog-parser--release_created'] == 'true' }}
